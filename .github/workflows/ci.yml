name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      # Links only fail the run. Old "Last verified" stamps print as warnings.
      - name: Docs
        run: npm run check:docs

      # New modules get copied from whatever `ncube startdomain` writes, so its
      # output has to pass type-check and lint too. About 20 seconds.
      - name: Generator
        run: npm run test:generator

      # Last of the fast checks, because it is the slowest — but it stays, because
      # type-check alone does not prove the app builds. A bad "use client"
      # boundary, or the shared barrel imported from a server component, only
      # fails here.
      - name: Build
        run: npm run build

# No e2e job, on purpose. The Playwright suite (`npm run test:e2e`) is for
# checking on your own machine before a PR, not in GitHub.
