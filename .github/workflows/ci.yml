name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      # Last of the fast checks, because it is the slowest — but it stays, because
      # type-check alone does not prove the app builds. A bad "use client"
      # boundary, or the shared barrel imported from a server component, only
      # fails here.
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only. The suite tests this app's behaviour, not browser
      # differences — adding Firefox and WebKit triples the runtime to re-prove
      # the same assertions.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself, with the mock API
      # beside it, so there is nothing to start here.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
